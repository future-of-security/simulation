<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phase 5 - Crisis Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-nav">
        <a href="../index.html" class="back-link">&larr; Back to Overview</a>
        <a href="../help.html" class="help-link">Help &amp; Rules</a>
      </div>
      <h1 class="header-title" id="phase-title">Phase 5</h1>
      <p class="header-subtitle" id="phase-subtitle">Loading...</p>
      <p class="last-updated" id="last-updated"></p>
    </header>

    <!-- Context Card -->
    <section class="card context-card">
      <h2 class="card-title">Situation</h2>
      <div class="context-text" id="phase-context">Loading...</div>
    </section>

    <!-- Status + Top 3 -->
    <section class="card stats-card">
      <h2 class="card-title">Current Status</h2>
      <div class="status-3col">
        <div class="status-col">
          <div class="status-col-label">Incidents</div>
          <div class="stats-row-compact">
            <div class="stat-item-small">
              <span class="stat-value" id="incident-total">--</span>
              <span class="stat-label">Total</span>
            </div>
            <div class="stat-item-small">
              <span class="stat-value" id="incident-active">--</span>
              <span class="stat-label">Active</span>
            </div>
            <div class="stat-item-small">
              <span class="stat-value" id="incident-resolved">--</span>
              <span class="stat-label">Resolved</span>
            </div>
            <div class="stat-item-small">
              <span class="stat-value stat-highlight" id="resolve-rate">--</span>
              <span class="stat-label">Resolve Rate</span>
            </div>
          </div>
        </div>
        <div class="status-col">
          <div class="status-col-label">Teams</div>
          <div class="stats-row-compact">
            <div class="stat-item-small">
              <span class="stat-value" id="avg-trust">--</span>
              <span class="stat-label">Avg Trust</span>
            </div>
            <div class="stat-item-small">
              <span class="stat-value" id="total-budget">--</span>
              <span class="stat-label">Total Budget</span>
            </div>
          </div>
        </div>
        <div class="status-col">
          <div class="status-col-label">Leaderboard</div>
          <div class="top3-list" id="top-teams">
            <!-- Populated by JavaScript -->
          </div>
        </div>
      </div>
    </section>

    <!-- Team Cards Grid -->
    <section class="card">
      <h2 class="card-title">Teams</h2>
      <div class="team-cards-grid" id="team-cards">
        <!-- Populated by JavaScript -->
      </div>
    </section>
  </div>

  <footer class="site-footer">
    This website is generated using AI. Please do not submit anything sensitive.
  </footer>

  <script>
    // Set phase number - CHANGE THIS FOR EACH PHASE
    const PHASE_NUM = 5;
  </script>
  <script src="../js/app.js"></script>
</body>
</html>
