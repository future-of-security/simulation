<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crisis Simulation Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="header-title" id="sim-title">Crisis Simulation Dashboard</h1>
      <p class="header-subtitle">Real-time monitoring and response coordination</p>
    </header>

    <!-- Overview Card -->
    <section class="card overview-card">
      <h2 class="card-title">Simulation Overview</h2>
      <div class="overview-text" id="sim-summary">
        Loading simulation overview...
      </div>
    </section>

    <!-- Phases List -->
    <section class="card phases-card">
      <h2 class="card-title">Phases</h2>
      <div class="phases-grid" id="phases-list">
        <!-- Populated by JavaScript -->
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
